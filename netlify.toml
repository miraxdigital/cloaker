[build]
functions = "netlify/functions"
command = "npm run build"
publish = "dist"

[functions]
node_bundler = "esbuild"

[[redirects]]
from = "/debug"
to = "/.netlify/functions/debug"
status = 200

[[redirects]]
from = "/health"
to = "/.netlify/functions/health"
status = 200

[[redirects]]
from = "/*"
to = "/.netlify/functions/redirect"
status = 200